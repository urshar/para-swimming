<!-- Tailkit: a-c-form-elements-03 "Select" (Application UI > Components > Form Elements) -->
<!-- Rohmaterial, ungeprüft — vor Übernahme gegen accessibility.md prüfen. Für den Punkterechner
     wird kein Mehrfachauswahl-Select gebraucht (Geschlecht ist eine Einzelauswahl); die
     Multiple-Select-Variante dient hier nur als Referenz für Filter mit Mehrfachauswahl. -->

<!-- Form Elements: Select -->
<form class="space-y-6 dark:text-gray-100" onsubmit="return false;">
  <!-- Select Box -->
  <div class="space-y-1">
    <label for="select" class="inline-block font-medium">Select</label>
    <select
      id="select"
      name="select"
      class="block w-full rounded-lg border border-gray-200 py-2 pr-10 pl-3 leading-6 focus:border-blue-500 focus:ring-3 focus:ring-blue-500/50 dark:border-gray-600 dark:bg-gray-800 dark:focus:border-blue-500"
    >
      <option>Vue.js</option>
      <option>React</option>
      <option>Angular</option>
      <option>Svelte</option>
      <option>Ember.js</option>
      <option>Meteor</option>
    </select>
  </div>
  <!-- END Select Box -->

  <!-- Multiple Select Box -->
  <div class="space-y-1">
    <label for="select_multiple" class="inline-block font-medium"
      >Select Multiple</label
    >
    <select
      id="select_multiple"
      name="select_multiple"
      multiple
      class="block w-full rounded-lg border border-gray-200 px-3 py-2 leading-6 focus:border-blue-500 focus:ring-3 focus:ring-blue-500/50 dark:border-gray-600 dark:bg-gray-800 dark:focus:border-blue-500"
    >
      <option>Vue.js</option>
      <option>React</option>
      <option>Angular</option>
      <option>Svelte</option>
      <option>Ember.js</option>
      <option>Meteor</option>
    </select>
  </div>
  <!-- END Multiple Select Box -->
</form>
<!-- END Form Elements: Select -->
